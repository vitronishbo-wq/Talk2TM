name: Deploy to Firebase (Hosting, Rules & Indexes)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  firebase_deploy:
    name: Validate & Deploy (Hosting + Firestore Rules)
    runs-on: ubuntu-latest
    if: ${{ github.repository != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run Unit & Crypto Tests
        run: npm test

      - name: Validate Firestore Security Rules (Emulator)
        run: npx -y firebase-tools@latest emulators:exec --only firestore "npx tsx tests/firestore.rules.test.ts"

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCfwTvVhyrRZHk4zzzRweShyVdMnimnzm0' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'gen-lang-client-0618196986.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'gen-lang-client-0618196986' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'gen-lang-client-0618196986.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '511328922010' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:511328922010:web:58c5982b1ab704d93f3223' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy Firestore Security Rules & Indexes
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT não configurado em Settings > Secrets and variables > Actions."
            exit 1
          fi
          SA_FILE="${{ runner.temp }}/firebase-sa.json"
          trap 'rm -f "$SA_FILE"' EXIT
          printf '%s' "$FIREBASE_SA_JSON" > "$SA_FILE"
          chmod 600 "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          npx -y firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes \
            --project gen-lang-client-0618196986 \
            --non-interactive

      - name: Deploy to Firebase Hosting (talk2tm.web.app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: 'gen-lang-client-0618196986'
