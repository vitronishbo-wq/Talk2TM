name: CI — Lint, Test, Rules & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validation, Rules Emulator & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run Unit & Crypto Tests
        run: npm test

      - name: Run Firestore Security Rules Tests (Emulator)
        run: npx -y firebase-tools@latest emulators:exec --only firestore "npx tsx tests/firestore.rules.test.ts"

      - name: Test Build (Client Bundle)
        run: npm run build
