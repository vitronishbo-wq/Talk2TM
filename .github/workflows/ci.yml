name: CI — Lint, Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validation & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run Unit Tests
        run: npx tsx -e "import { runTalk2TMTests } from './tests/talk2tm.test'; const res = runTalk2TMTests(); console.log('Result:', res); if (res.passed !== res.total) process.exit(1);"

      - name: Test Build (Client Bundle)
        run: npm run build
