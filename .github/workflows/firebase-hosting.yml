name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: 'gen-lang-client-0618196986'
          VITE_FIREBASE_AUTH_DOMAIN: 'gen-lang-client-0618196986.firebaseapp.com'
          VITE_FIREBASE_STORAGE_BUCKET: 'gen-lang-client-0618196986.firebasestorage.app'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gen-lang-client-0618196986
          channelId: live
